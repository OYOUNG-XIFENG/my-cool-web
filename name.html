<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冯瑶 - 个人数字名片</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #0c1445 0%, #1a237e 50%, #0d47a1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, white, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 230px 80px, white, transparent),
                radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 50px 200px, white, transparent),
                radial-gradient(2px 2px at 100px 250px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 200px 180px, white, transparent),
                radial-gradient(2px 2px at 280px 220px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 350px 100px, white, transparent),
                radial-gradient(2px 2px at 400px 200px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 450px 50px, white, transparent),
                radial-gradient(2px 2px at 500px 280px, rgba(255,255,255,0.8), transparent);
            background-repeat: repeat;
            background-size: 500px 300px;
            animation: twinkle 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes twinkle {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 380px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 24px;
            transition: transform 0.3s ease;
        }

        .card:hover .avatar {
            transform: scale(1.05);
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .profession {
            font-size: 16px;
            color: #60a5fa;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 16px;
            color: #ffffff;
            line-height: 1.8;
            margin-bottom: 32px;
            padding: 0 10px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0);
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .social-btn:hover::before {
            transform: scale(1);
        }

        .social-btn.wechat {
            background: linear-gradient(135deg, #07c160, #06ad56);
        }

        .social-btn.wechat:hover {
            background: linear-gradient(135deg, #06ad56, #059349);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(7, 193, 96, 0.4);
        }

        .social-btn.weibo {
            background: linear-gradient(135deg, #e6162d, #c71523);
        }

        .social-btn.weibo:hover {
            background: linear-gradient(135deg, #c71523, #a9111d);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(230, 22, 45, 0.4);
        }

        .social-btn.github {
            background: linear-gradient(135deg, #24292e, #1a1f24);
        }

        .social-btn.github:hover {
            background: linear-gradient(135deg, #1a1f24, #0d0f11);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(36, 41, 46, 0.4);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-4px);
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 28px;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }

            .name {
                font-size: 24px;
            }

            .profession {
                font-size: 14px;
            }

            .bio {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    <div class="card">
        <img src="avatar.jpg" alt="头像" class="avatar">
        <h1 class="name">[OYOUNG]</h1>
        <p class="profession">未来 AI 架构师</p>
        <p class="bio">我正在学习使用 AI 编程，目标是做出最酷的产品。</p>
        <div class="social-buttons">
            <button class="social-btn wechat" onclick="handleSocialClick('wechat')" title="微信">
                <i class="fab fa-weixin"></i>
            </button>
            <button class="social-btn weibo" onclick="handleSocialClick('weibo')" title="微博">
                <i class="fab fa-weibo"></i>
            </button>
            <button class="social-btn github" onclick="handleSocialClick('github')" title="GitHub">
                <i class="fab fa-github"></i>
            </button>
        </div>
    </div>

    <script>
        function handleSocialClick(platform) {
            const messages = {
                wechat: '微信号：zhangsan_ai',
                weibo: '微博：@张三的AI探索',
                github: 'GitHub：github.com/zhangsan-ai'
            };
            alert(`点击了 ${platform.toUpperCase()}\n${messages[platform]}`);
        }
    </script>
</body>
</html>
