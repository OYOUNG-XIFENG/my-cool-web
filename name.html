<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冯瑶 - 个人数字名片</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
            padding: 8% 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(148, 163, 184, 0.3);
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .card:hover .avatar {
            transform: scale(1.05);
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .profession {
            font-size: 16px;
            color: #60a5fa;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 16px;
            color: #e2e8f0;
            line-height: 1.8;
            margin-bottom: 24px;
            padding: 0 10px;
        }

        .skills-section {
            margin-bottom: 28px;
        }

        .skills-title {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .skills-cloud {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .skill-tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #ffffff;
            transition: all 0.3s ease;
            cursor: default;
        }

        .skill-tag:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .skill-tag:nth-child(6n+1) {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .skill-tag:nth-child(6n+2) {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .skill-tag:nth-child(6n+3) {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .skill-tag:nth-child(6n+4) {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .skill-tag:nth-child(6n+5) {
            background: linear-gradient(135deg, #ec4899, #db2777);
        }

        .skill-tag:nth-child(6n+6) {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.4s ease;
            border: none;
        }

        .social-btn.wechat {
            background: linear-gradient(135deg, #07c160, #06ad56);
        }

        .social-btn.wechat:hover {
            transform: scale(1.2) rotate(360deg);
            filter: drop-shadow(0 0 10px #07c160);
        }

        .social-btn.weibo {
            background: linear-gradient(135deg, #e6162d, #c71523);
        }

        .social-btn.weibo:hover {
            transform: scale(1.2) rotate(360deg);
            filter: drop-shadow(0 0 10px #e6162d);
        }

        .social-btn.github {
            background: linear-gradient(135deg, #374151, #2d3748);
        }

        .social-btn.github:hover {
            transform: scale(1.2) rotate(360deg);
            filter: drop-shadow(0 0 10px #ffffff);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(148, 163, 184, 0.2);
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 28px;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }

            .name {
                font-size: 24px;
            }

            .profession {
                font-size: 14px;
            }

            .bio {
                font-size: 13px;
            }

            .skills-title {
                font-size: 16px;
            }

            .skill-tag {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    <div class="card">
        <img src="avatar.jpg" alt="头像" class="avatar">
        <h1 class="name">[OYOUNG]</h1>
        <p class="profession">未来 AI 架构师</p>
        <p class="bio">我正在学习使用 AI 编程，目标是做出最酷的产品。</p>
        
        <div class="skills-section">
            <h3 class="skills-title">我的技能树</h3>
            <div class="skills-cloud">
                <span class="skill-tag">AI 产品设计</span>
                <span class="skill-tag">Prompt Engineering</span>
                <span class="skill-tag">数据分析</span>
                <span class="skill-tag">用户研究</span>
                <span class="skill-tag">HTML/CSS</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">团队协作</span>
                <span class="skill-tag">项目管理</span>
            </div>
        </div>

        <div class="social-buttons">
            <button class="social-btn wechat" onclick="handleSocialClick('wechat')" title="微信">
                <i class="fab fa-weixin"></i>
            </button>
            <button class="social-btn weibo" onclick="handleSocialClick('weibo')" title="微博">
                <i class="fab fa-weibo"></i>
            </button>
            <button class="social-btn github" onclick="handleSocialClick('github')" title="GitHub">
                <i class="fab fa-github"></i>
            </button>
        </div>
    </div>

    <script>
        function handleSocialClick(platform) {
            const messages = {
                wechat: '微信号：zhangsan_ai',
                weibo: '微博：@张三的AI探索',
                github: 'GitHub：github.com/zhangsan-ai'
            };
            alert(`点击了 ${platform.toUpperCase()}\n${messages[platform]}`);
        }
    </script>
</body>
</html>
