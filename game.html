<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜数字游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
            padding: 8% 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #e2e8f0;
            font-size: 36px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(148, 163, 184, 0.8), 0 0 20px rgba(148, 163, 184, 0.4);
        }

        .game-container {
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }

        input[type="number"] {
            width: 150px;
            padding: 12px 20px;
            font-size: 24px;
            background-color: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(148, 163, 184, 0.3);
            color: #e2e8f0;
            text-align: center;
            outline: none;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button {
            padding: 12px 32px;
            font-size: 20px;
            background-color: rgba(59, 130, 246, 0.8);
            color: #e2e8f0;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background-color: rgba(59, 130, 246, 1);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        button:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message {
            font-size: 24px;
            font-weight: bold;
            min-height: 36px;
            margin-bottom: 20px;
        }

        #message.too-high {
            color: #f87171;
        }

        #message.too-low {
            color: #60a5fa;
        }

        #message.correct {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
        }

        #attempts {
            color: #e2e8f0;
            font-size: 18px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(148, 163, 184, 0.2);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    <h1>猜数字游戏</h1>
    <div class="game-container">
        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="100" placeholder="1-100">
            <button id="guessBtn">猜一下</button>
        </div>
        <div id="message"></div>
        <div id="attempts">猜的次数：0</div>
    </div>

    <script>
        let secretNumber;
        let attempts = 0;

        function initGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            document.getElementById('attempts').textContent = `猜的次数：${attempts}`;
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = '';
            document.getElementById('guessBtn').disabled = false;
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').focus();
        }

        function checkGuess() {
            const input = document.getElementById('guessInput');
            const guess = parseInt(input.value);
            
            if (isNaN(guess) || guess < 1 || guess > 100) {
                alert('请输入1到100之间的数字');
                input.focus();
                return;
            }

            attempts++;
            document.getElementById('attempts').textContent = `猜的次数：${attempts}`;

            const message = document.getElementById('message');
            
            if (guess > secretNumber) {
                message.textContent = '太大了，再小点';
                message.className = 'too-high';
            } else if (guess < secretNumber) {
                message.textContent = '太小了，再大点';
                message.className = 'too-low';
            } else {
                message.textContent = '恭喜你！猜对了！';
                message.className = 'correct';
                document.getElementById('guessBtn').disabled = true;
            }

            input.value = '';
            input.focus();
        }

        document.getElementById('guessBtn').addEventListener('click', checkGuess);
        
        document.getElementById('guessInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });

        window.addEventListener('load', initGame);
    </script>
</body>
</html>
