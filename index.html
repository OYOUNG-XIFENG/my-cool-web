<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
            padding: 8% 5%;
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
            cursor: pointer;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .glow-text {
            font-size: 48px;
            font-weight: 700;
            color: #e2e8f0;
            text-shadow: 
                0 0 10px rgba(148, 163, 184, 0.8),
                0 0 20px rgba(148, 163, 184, 0.6),
                0 0 40px rgba(148, 163, 184, 0.4);
            margin-bottom: 60px;
            letter-spacing: 4px;
            display: inline-block;
            white-space: nowrap;
        }

        .glow-text::after {
            content: '|';
            animation: blink 1s infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .nav-btn {
            position: relative;
            padding: 24px 64px;
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            color: #e2e8f0;
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.5);
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.8);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn:nth-child(1) {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.5);
        }

        .nav-btn:nth-child(1):hover {
            background: rgba(34, 197, 94, 0.3);
            box-shadow: 0 10px 40px rgba(34, 197, 94, 0.3);
            border-color: rgba(34, 197, 94, 0.8);
        }

        .nav-btn:nth-child(2) {
            background: rgba(249, 115, 22, 0.2);
            border-color: rgba(249, 115, 22, 0.5);
        }

        .nav-btn:nth-child(2):hover {
            background: rgba(249, 115, 22, 0.3);
            box-shadow: 0 10px 40px rgba(249, 115, 22, 0.3);
            border-color: rgba(249, 115, 22, 0.8);
        }

        .easter-egg-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(148, 163, 184, 0.6);
            z-index: 2;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .easter-egg-hint:hover {
            color: #e2e8f0;
        }

        .ai-robot {
            position: fixed;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(145deg, #1e293b, #334155);
            border-radius: 20px;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 100;
            cursor: pointer;
            transition: bottom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(59, 130, 246, 0.5);
        }

        .ai-robot.show {
            bottom: 60px;
        }

        .robot-face {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #60a5fa, #3b82f6);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .robot-eye {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            margin: 4px;
            animation: blink 3s infinite;
        }

        .robot-mouth {
            width: 20px;
            height: 8px;
            background: #fff;
            border-radius: 0 0 10px 10px;
            margin-top: 4px;
        }

        .robot-speech {
            font-size: 16px;
            color: #e2e8f0;
            max-width: 280px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .glow-text {
                font-size: 28px;
                letter-spacing: 2px;
            }

            .nav-btn {
                padding: 20px 40px;
                font-size: 20px;
            }

            .ai-robot {
                flex-direction: column;
                padding: 20px;
                text-align: center;
                margin: 0 20px;
            }

            .robot-speech {
                font-size: 14px;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="content">
        <h1 class="glow-text" id="typewriter-text"></h1>
        
        <div class="buttons-container">
            <a href="name.html" class="nav-btn">我的名片</a>
            <a href="game.html" class="nav-btn">猜数字游戏</a>
        </div>
    </div>

    <p class="easter-egg-hint">点击这个页面的任意位置，会出现一个隐藏的 AI 机器人！</p>

    <div class="ai-robot" id="aiRobot">
        <div class="robot-face">
            <div class="robot-eye"></div>
            <div class="robot-eye"></div>
            <div class="robot-mouth"></div>
        </div>
        <div class="robot-speech">你好！我是你的 AI 伙伴，需要我帮忙吗？</div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: {
                    value: 80,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: '#e2e8f0'
                },
                shape: {
                    type: 'circle'
                },
                opacity: {
                    value: 0.6,
                    random: true
                },
                size: {
                    value: 2,
                    random: true
                },
                line_linked: {
                    enable: false
                },
                move: {
                    enable: true,
                    speed: 1,
                    direction: 'none',
                    random: true,
                    straight: false,
                    out_mode: 'out',
                    bounce: false
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    resize: true
                }
            },
            retina_detect: true
        });

        function typeWriter() {
            const text = '冯瑶的 AI 探索空间';
            const element = document.getElementById('typewriter-text');
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    element.textContent = text.substring(0, i + 1);
                    i++;
                    setTimeout(type, 150);
                }
            }
            
            type();
        }

        let robotShown = false;
        const aiRobot = document.getElementById('aiRobot');

        document.addEventListener('click', function(e) {
            const target = e.target;
            if (!robotShown && !target.classList.contains('nav-btn') && !target.classList.contains('ai-robot') && !target.classList.contains('robot-face') && !target.classList.contains('robot-speech') && !target.classList.contains('robot-eye') && !target.classList.contains('robot-mouth')) {
                aiRobot.classList.add('show');
                robotShown = true;
            }
        });

        aiRobot.addEventListener('click', function() {
            aiRobot.classList.remove('show');
            robotShown = false;
        });

        document.addEventListener('DOMContentLoaded', typeWriter);
    </script>
</body>
</html>
