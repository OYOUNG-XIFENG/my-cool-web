<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
            padding: 8% 5%;
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            overflow-x: hidden;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .glow-text {
            font-size: 48px;
            font-weight: 700;
            color: #e2e8f0;
            text-shadow: 
                0 0 10px rgba(148, 163, 184, 0.8),
                0 0 20px rgba(148, 163, 184, 0.6),
                0 0 40px rgba(148, 163, 184, 0.4);
            margin-bottom: 60px;
            letter-spacing: 4px;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
        }

        .cursor {
            animation: blink 1s step-end infinite;
            color: #fff;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .nav-btn {
            position: relative;
            padding: 24px 64px;
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            color: #e2e8f0;
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.5);
            border-radius: 50px;
            transition: all 0.3s ease-in-out;
        }

        .nav-btn:hover {
            transform: translateY(-8px);
            background: rgba(59, 130, 246, 0.25);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.4);
            border-color: rgba(59, 130, 246, 0.8);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn:nth-child(1) {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.5);
        }

        .nav-btn:nth-child(1):hover {
            background: rgba(34, 197, 94, 0.25);
            box-shadow: 0 12px 35px rgba(34, 197, 94, 0.4);
            border-color: rgba(34, 197, 94, 0.8);
        }

        .nav-btn:nth-child(2) {
            background: rgba(249, 115, 22, 0.2);
            border-color: rgba(249, 115, 22, 0.5);
        }

        .nav-btn:nth-child(2):hover {
            background: rgba(249, 115, 22, 0.25);
            box-shadow: 0 12px 35px rgba(249, 115, 22, 0.4);
            border-color: rgba(249, 115, 22, 0.8);
        }

        .guestbook-section {
            width: 100%;
            max-width: 600px;
            margin-top: 80px;
            padding-bottom: 150px;
            position: relative;
            z-index: 1;
        }

        .guestbook-title {
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
        }

        .guestbook-subtitle {
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
        }

        .guestbook-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .guestbook-form input[type="text"],
        .guestbook-form textarea {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e2e8f0;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .guestbook-form input[type="text"] {
            height: 45px;
            padding: 0 15px;
            font-size: 14px;
        }

        .guestbook-form input[type="text"]::placeholder,
        .guestbook-form textarea::placeholder {
            color: #64748b;
        }

        .guestbook-form input[type="text"]:focus,
        .guestbook-form textarea:focus {
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .guestbook-form textarea {
            height: 100px;
            padding: 12px 15px;
            font-size: 14px;
            resize: none;
        }

        .submit-btn {
            width: 120px;
            height: 45px;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #2563eb;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .guestbook-messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-card {
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .message-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .avatar-letter {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .message-nickname {
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
        }

        .message-time {
            color: #64748b;
            font-size: 12px;
        }

        .message-text {
            color: #e2e8f0;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .easter-egg-hint {
            margin-top: 50px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            cursor: pointer;
            transition: color 0.3s ease;
            padding-bottom: 20px;
        }

        .easter-egg-hint:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        .success-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #10b981;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .success-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .ai-robot {
            position: fixed;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(145deg, #1e293b, #334155);
            border-radius: 20px;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 200;
            cursor: pointer;
            transition: bottom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(59, 130, 246, 0.5);
        }

        .ai-robot.show {
            bottom: 80px;
        }

        .robot-face {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #60a5fa, #3b82f6);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .robot-eye {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            margin: 4px;
        }

        .robot-mouth {
            width: 20px;
            height: 8px;
            background: #fff;
            border-radius: 0 0 10px 10px;
            margin-top: 4px;
        }

        .robot-speech {
            font-size: 16px;
            color: #e2e8f0;
            max-width: 280px;
            line-height: 1.5;
        }

        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .player-toggle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(40, 40, 50, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: box-shadow 0.3s ease;
            position: relative;
            user-select: none;
        }

        .player-toggle:active {
            cursor: grabbing;
        }

        .player-toggle.dragging {
            cursor: grabbing;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .player-toggle .music-icon {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .player-toggle.playing .music-icon {
            animation: breathe 2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .player-panel {
            position: absolute;
            bottom: 70px;
            right: 0;
            width: 260px;
            height: 360px;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .player-panel.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .player-panel.left {
            right: auto;
            left: 0;
        }

        .vinyl {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .vinyl::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle at center,
                transparent 0px,
                transparent 3px,
                rgba(255, 255, 255, 0.03) 3px,
                rgba(255, 255, 255, 0.03) 4px
            );
        }

        .vinyl-center {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.2);
        }

        .vinyl-center::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
        }

        .vinyl.playing {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-info {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .song-title {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .player-progress-mini {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 15px;
            cursor: pointer;
            position: relative;
        }

        .player-progress-mini-bar {
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .player-controls-mini {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .control-mini {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-mini:hover {
            color: rgba(255, 255, 255, 0.9);
            transform: scale(1.1);
        }

        .control-mini.play-pause {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 16px;
        }

        .control-mini.play-pause:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 0 10px;
        }

        .volume-icon {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: color 0.3s ease;
            min-width: 20px;
        }

        .volume-icon:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .volume-slider {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .volume-slider-bar {
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            width: 70%;
            transition: width 0.1s linear;
        }

        @media (max-width: 480px) {
            .glow-text {
                font-size: 28px;
                letter-spacing: 2px;
            }

            .nav-btn {
                padding: 20px 40px;
                font-size: 20px;
            }

            .guestbook-section {
                max-width: 100%;
            }

            .message-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .message-header {
                flex-direction: column;
                gap: 5px;
            }

            .ai-robot {
                flex-direction: column;
                padding: 20px;
                text-align: center;
                margin: 0 20px;
                z-index: 300;
            }

            .ai-robot.show {
                bottom: 40px;
            }

            .robot-speech {
                font-size: 14px;
                max-width: 200px;
            }

            .player-panel {
                width: 250px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
</head>
<body>
    <div id="particles-js" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></div>
    <div class="content">
        <h1 class="glow-text"><span id="typewriter-text"></span><span class="cursor">|</span></h1>
        
        <div class="buttons-container">
            <a href="name.html" class="nav-btn">我的名片</a>
            <a href="game.html" class="nav-btn">猜数字游戏</a>
        </div>
    </div>

    <section class="guestbook-section">
        <h2 class="guestbook-title">💬 访客留言墙</h2>
        <p class="guestbook-subtitle">留下你的足迹，和我交流吧！</p>
        
        <form class="guestbook-form" id="guestbookForm">
            <input type="text" id="nicknameInput" placeholder="你的昵称" maxlength="20">
            <textarea id="messageInput" placeholder="说点什么吧..." maxlength="500"></textarea>
            <button type="submit" class="submit-btn">发布留言</button>
        </form>

        <div class="guestbook-messages" id="messagesContainer"></div>

        <p class="easter-egg-hint">点击这个页面的任意位置，会出现一个隐藏的 AI 机器人！</p>
    </section>

    <div class="ai-robot" id="aiRobot">
        <div class="robot-face">
            <div class="robot-eye"></div>
            <div class="robot-eye"></div>
            <div class="robot-mouth"></div>
        </div>
        <div class="robot-speech">你好！我是你的 AI 伙伴，需要我帮忙吗？</div>
    </div>

    <div class="success-toast" id="successToast">留言成功！</div>

    <div class="music-player" id="musicPlayer">
        <div class="player-panel" id="playerPanel">
            <div class="vinyl" id="vinyl">
                <div class="vinyl-center"></div>
            </div>
            <div class="song-info">
                <div class="song-title" id="songTitle">--</div>
                <div class="song-artist" id="songArtist">--</div>
            </div>
            <div class="player-progress-mini" id="progressMini">
                <div class="player-progress-mini-bar" id="progressBarMini"></div>
            </div>
            <div class="player-controls-mini">
                <button class="control-mini" id="prevBtn">⏮</button>
                <button class="control-mini play-pause" id="playPauseBtn">▶</button>
                <button class="control-mini" id="nextBtn">⏭</button>
            </div>
            <div class="volume-control">
                <span class="volume-icon" id="volumeIcon">🔊</span>
                <div class="volume-slider" id="volumeSlider">
                    <div class="volume-slider-bar" id="volumeBar"></div>
                </div>
            </div>
        </div>
        <button class="player-toggle" id="playerToggle">
            <span class="music-icon">🎵</span>
        </button>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
      particlesJS("particles-js", {
        "particles": {
          "number": {"value": 50},
          "color": {"value": "#ffffff"},
          "opacity": {"value": 0.25},
          "size": {"value": 2},
          "line_linked": {"enable": true, "distance": 120, "color": "#ffffff", "opacity": 0.15, "width": 0.5},
          "move": {"enable": true, "speed": 0.4, "direction": "none", "out_mode": "out"}
        }
      });

        const playlist = [
            { 
                title: "We Are Heading to the East", 
                artist: "springtide",
                src: "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/Music_for_Video/springtide/Sounds_strange_weird_but_unmistakably_romantic_Vol1/springtide_-_03_-_We_Are_Heading_to_the_East.mp3"
            },
            { 
                title: "Algorithms", 
                artist: "Chad Crouch",
                src: "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Chad_Crouch/Arps/Chad_Crouch_-_Algorithms.mp3"
            },
            { 
                title: "Enthusiast", 
                artist: "Tours",
                src: "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Tours/Enthusiast/Tours_-_01_-_Enthusiast.mp3"
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let isPanelOpen = false;
        let volume = 0.7;

        const audio = document.getElementById('audioPlayer');
        const musicPlayer = document.getElementById('musicPlayer');
        const playerToggle = document.getElementById('playerToggle');
        const playerPanel = document.getElementById('playerPanel');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressMini = document.getElementById('progressMini');
        const progressBarMini = document.getElementById('progressBarMini');
        const vinyl = document.getElementById('vinyl');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeBar = document.getElementById('volumeBar');

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let playerStartX = 0;
        let playerStartY = 0;
        let hasMoved = false;

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            songTitle.textContent = track.title;
            songArtist.textContent = track.artist;
            audio.volume = volume;
            volumeBar.style.width = (volume * 100) + '%';
            updateVolumeIcon();
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playPauseBtn.textContent = '▶';
                vinyl.classList.remove('playing');
                playerToggle.classList.remove('playing');
            } else {
                audio.play().catch(() => {});
                playPauseBtn.textContent = '⏸';
                vinyl.classList.add('playing');
                playerToggle.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        function playTrack(index) {
            currentIndex = index;
            loadTrack(currentIndex);
            audio.play().catch(() => {});
            playPauseBtn.textContent = '⏸';
            vinyl.classList.add('playing');
            playerToggle.classList.add('playing');
            isPlaying = true;
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playTrack(currentIndex);
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            playTrack(currentIndex);
        }

        function togglePanel() {
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) {
                playerPanel.classList.add('show');
            } else {
                playerPanel.classList.remove('show');
            }
        }

        function updateVolumeIcon() {
            if (volume === 0) {
                volumeIcon.textContent = '🔇';
            } else if (volume < 0.5) {
                volumeIcon.textContent = '🔉';
            } else {
                volumeIcon.textContent = '🔊';
            }
        }

        function snapToEdge() {
            const rect = musicPlayer.getBoundingClientRect();
            const windowWidth = window.innerWidth;
            const centerX = rect.left + rect.width / 2;
            
            if (centerX < windowWidth / 2) {
                musicPlayer.style.left = '20px';
                musicPlayer.style.right = 'auto';
                playerPanel.classList.add('left');
            } else {
                musicPlayer.style.left = 'auto';
                musicPlayer.style.right = '20px';
                playerPanel.classList.remove('left');
            }
        }

        playerToggle.addEventListener('mousedown', (e) => {
            isDragging = true;
            hasMoved = false;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            playerStartX = musicPlayer.offsetLeft;
            playerStartY = musicPlayer.offsetTop;
            playerToggle.classList.add('dragging');
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - dragStartX;
            const deltaY = e.clientY - dragStartY;
            
            if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                hasMoved = true;
            }
            
            let newX = playerStartX + deltaX;
            let newY = playerStartY + deltaY;
            
            const maxX = window.innerWidth - 60;
            const maxY = window.innerHeight - 60;
            
            newX = Math.max(0, Math.min(newX, maxX));
            newY = Math.max(0, Math.min(newY, maxY));
            
            musicPlayer.style.left = newX + 'px';
            musicPlayer.style.right = 'auto';
            musicPlayer.style.top = newY + 'px';
            musicPlayer.style.bottom = 'auto';
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                playerToggle.classList.remove('dragging');
                snapToEdge();
            }
        });

        playerToggle.addEventListener('click', (e) => {
            if (!hasMoved) {
                togglePanel();
            }
        });

        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlay();
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            prevTrack();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            nextTrack();
        });

        progressMini.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = progressMini.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
        });

        volumeSlider.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = volumeSlider.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            volume = Math.max(0, Math.min(1, percent));
            audio.volume = volume;
            volumeBar.style.width = (volume * 100) + '%';
            updateVolumeIcon();
        });

        volumeIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            if (volume > 0) {
                audio.prevVolume = volume;
                volume = 0;
            } else {
                volume = audio.prevVolume || 0.7;
            }
            audio.volume = volume;
            volumeBar.style.width = (volume * 100) + '%';
            updateVolumeIcon();
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBarMini.style.width = percent + '%';
            }
        });

        audio.addEventListener('ended', () => {
            nextTrack();
        });

        document.addEventListener('click', (e) => {
            const target = e.target;
            if (!target.closest('.nav-btn') && !target.closest('.ai-robot') && !target.closest('.guestbook-section') && !target.closest('.music-player')) {
                if (!robotShown) {
                    aiRobot.classList.add('show');
                    robotShown = true;
                }
            }
        });

        aiRobot.addEventListener('click', (e) => {
            e.stopPropagation();
            aiRobot.classList.remove('show');
            robotShown = false;
        });

        const avatarColors = [
            '#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', 
            '#ec4899', '#06b6d4', '#ef4444', '#84cc16'
        ];

        function getAvatarColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }

        function formatTimeMsg(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return '刚刚';
            if (minutes < 60) return `${minutes}分钟前`;
            if (hours < 24) return `${hours}小时前`;
            return `${days}天前`;
        }

        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('guestbook_messages') || '[]');
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const displayMessages = messages.slice(0, 10);
            
            displayMessages.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'message-card';
                card.innerHTML = `
                    <div class="avatar-letter" style="background: ${getAvatarColor(msg.nickname)}">${msg.nickname.charAt(0).toUpperCase()}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-nickname">${msg.nickname}</span>
                            <span class="message-time">${formatTimeMsg(msg.timestamp)}</span>
                        </div>
                        <p class="message-text">${msg.text}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function saveMessage(nickname, text) {
            const messages = JSON.parse(localStorage.getItem('guestbook_messages') || '[]');
            messages.unshift({
                nickname: nickname,
                text: text,
                timestamp: Date.now()
            });
            localStorage.setItem('guestbook_messages', JSON.stringify(messages));
        }

        function showToast() {
            const toast = document.getElementById('successToast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        document.getElementById('guestbookForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nickname = document.getElementById('nicknameInput').value.trim();
            const text = document.getElementById('messageInput').value.trim();

            if (!nickname || !text) {
                alert('请填写昵称和留言内容');
                return;
            }

            saveMessage(nickname, text);
            loadMessages();
            
            document.getElementById('nicknameInput').value = '';
            document.getElementById('messageInput').value = '';
            
            showToast();
        });

        const text = "冯瑶的 AI 探索空间";
        const element = document.getElementById("typewriter-text");
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                element.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 150);
            }
        }

        loadTrack(currentIndex);
        window.addEventListener('load', loadMessages);
        window.addEventListener('load', function() {
            setTimeout(typeWriter, 500);
        });
        setInterval(loadMessages, 30000);
    </script>
</body>
</html>
